services:

  # ── Infra ─────────────────────────────────────────────────
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.8-management
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 10

  # 類似インシデント検索（SimilarPatternRule の graded confidence 用）。
  # client は v7 系なので image も 7.17 系で揃える。シングルノード・security 無効（ローカル/デモ用途）。
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Valkey: SSE Pub/Sub（worker→Cloud Run edge の fan-out）＋ read-model projection（CQRS read model）。
  # SoT ではない＝再構築可能な派生ビュー/transport なので永続化しない（step4-1-strategy §11.3）。Redis 互換。
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── EC ────────────────────────────────────────────────────
  ec-backend:
    build:
      context: .
      dockerfile: src/apps/ec/backend/Dockerfile
      target: prod
    environment:
      MONGO_URL: mongodb://mongo:27017/ec
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_VHOST: /
      RABBITMQ_RETRY_TTL: "5000"
      EXCHANGE_NAME: ec-domain-events
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── Backoffice ────────────────────────────────────────────
  backoffice-backend:
    build:
      context: .
      dockerfile: src/apps/backoffice/backend/Dockerfile
      target: prod
    environment:
      PORT: "3001"
      MONGO_URL: mongodb://mongo:27017/monitoring
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_VHOST: /
      RABBITMQ_RETRY_TTL: "5000"
      EXCHANGE_NAME: ec-domain-events
      # read-model projection ＋ SSE Pub/Sub の接続先（コード側 RedisSSEAlertNotifier / read-model 実装で使用）
      REDIS_URL: redis://valkey:6379
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongo-data:
  es-data:
