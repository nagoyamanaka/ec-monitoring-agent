<!doctype html>
<meta charset="utf-8" />
<style>
  html,
  body {
    margin: 0;
    padding: 0;
  }
  .card {
    width: 1920px;
    height: 1080px;
    background: #0b1220;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Noto Sans CJK JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .accent {
    width: 96px;
    height: 5px;
    border-radius: 3px;
    background: #2dd4bf;
    margin-bottom: 56px;
    opacity: 0.9;
  }
  .headline {
    color: #e6edf7;
    font-weight: 700;
    font-size: 108px;
    letter-spacing: 0.01em;
    line-height: 1.18;
    text-align: center;
  }
  .subtitle {
    margin-top: 52px;
    color: #8fa3bf;
    font-weight: 500;
    font-size: 44px;
    letter-spacing: 0.04em;
  }
  .subtitle .brand {
    color: #2dd4bf;
    font-weight: 700;
  }
</style>
<div class="card">
  <div class="accent"></div>
  <div class="headline">障害は、起きる前に終わらせる。</div>
  <div class="subtitle"><span class="brand">Kizashi</span> — AI-SRE エージェント</div>
</div>
