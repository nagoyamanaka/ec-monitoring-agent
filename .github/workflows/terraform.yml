name: terraform

# IaC（infra/terraform）の plan(PR) / apply(main・手動承認)。WIF キーレス認証（§11.5）。
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # WIF の OIDC トークン取得に必須
  pull-requests: write

defaults:
  run:
    working-directory: infra/terraform/envs/prod

env:
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=ec-monitoring-agent/prod"

      - run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - run: terraform validate

      - run: terraform plan -no-color -input=false

  apply:
    # main への push（または手動）でのみ apply。environment 承認ゲートを噛ませる。
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=ec-monitoring-agent/prod"

      - run: terraform apply -auto-approve -input=false
