name: app

# アプリ資材の pipeline: typecheck/UT/E2E（CI）→ image build & push → deploy（CD）。
# インフラ資材は terraform.yml が別 pipeline として plan/apply を担当する。
on:
  push:
    branches: [main]

jobs:
  # ── Job 1: 静的チェック（インフラ不要・高速）──────────────────────────────
  check:
    name: typecheck / UT
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # ── Job 2: E2E（Docker Compose でフルスタック起動）────────────────────────
  # check が通ってから実行。docker-compose.e2e.yml で AI_INVESTIGATION_STUB=true を上書きするため
  # Gemini API キーは不要。
  e2e:
    name: E2E (Docker Compose)
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # docker-compose.local.yml の dev サービスは `- .:/app` で checkout を丸ごと
      # コンテナに被せる。pnpm の isolated linker は各 workspace パッケージの依存を
      # `<pkg>/node_modules/` 配下に symlink するが、この bind mount がそれを
      # ホスト側ツリーで shadow するため、ホスト未 install だとコンテナ内で
      # パッケージ直下の依存（例: ec-backend の cors）が ERR_MODULE_NOT_FOUND になる。
      # runner で frozen install しておくと、ホストツリーに同じ相対 symlink が用意され
      # （リンク先 .pnpm は各サービスの匿名ボリューム=pruned イメージ側で解決される）、
      # コンテナ起動が通る。
      - name: Install dependencies (populate workspace symlinks for bind mount)
        run: pnpm install --frozen-lockfile

      - name: Run E2E suite
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml \
            run --rm e2e

  # ── Job 3: frontend イメージ build & push → Cloud Run deploy ────────────────
  # check + e2e が通った後、main への push 時のみ実行。
  # WIF キーレス認証（terraform.yml と同じパターン）。
  # 必要な GitHub Actions Variables: WIF_PROVIDER, DEPLOYER_SA, GCP_PROJECT_ID,
  #   AR_HOST（例: asia-northeast1-docker.pkg.dev）, AR_REPO_ID（例: apps）, GCP_REGION
  build-push-frontend:
    name: Build & push frontend (nginx)
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_HOST }} --quiet

      - name: Build frontend image
        run: |
          docker build \
            --target runner \
            -t ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/backoffice-frontend:${{ github.sha }} \
            -t ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/backoffice-frontend:latest \
            -f src/apps/backoffice/frontend/Dockerfile \
            .

      - name: Push frontend image
        run: |
          docker push ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/backoffice-frontend:${{ github.sha }}
          docker push ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/backoffice-frontend:latest

      - name: Deploy to Cloud Run (frontend)
        run: |
          gcloud run services update backoffice-frontend \
            --image ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/backoffice-frontend:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }}

  # ── Job 4: backend イメージ build & push → GCE backbone デプロイ ────────────
  # check + e2e が通った後、main への push 時のみ実行。
  # 必要な GitHub Actions Variables: WIF_PROVIDER, DEPLOYER_SA, GCP_PROJECT_ID,
  #   AR_HOST, AR_REPO_ID, GCP_REGION, GCE_INSTANCE, GCE_ZONE, DEPLOY_BUCKET
  build-push-backend:
    name: Build & push backend (GCE backbone)
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_HOST }} --quiet

      - name: Build ec-backend image
        run: |
          docker build --target prod \
            -t ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/ec-backend:${{ github.sha }} \
            -t ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/ec-backend:latest \
            -f src/apps/ec/backend/Dockerfile .

      - name: Build backoffice-backend image
        run: |
          docker build --target prod \
            -t ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/backoffice-backend:${{ github.sha }} \
            -t ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/backoffice-backend:latest \
            -f src/apps/backoffice/backend/Dockerfile .

      - name: Push backend images
        run: |
          docker push ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/ec-backend:${{ github.sha }}
          docker push ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/ec-backend:latest
          docker push ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/backoffice-backend:${{ github.sha }}
          docker push ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/backoffice-backend:latest

  # ── Job 5: GCE backbone デプロイ ──────────────────────────────────────────
  # front/back 両イメージの push が完了してから GCE を再起動する。
  deploy-gce:
    name: Deploy to GCE backbone
    runs-on: ubuntu-latest
    needs: [build-push-frontend, build-push-backend]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload compose files to GCS
        run: |
          gcloud storage cp docker-compose.yml gs://${{ vars.DEPLOY_BUCKET }}/docker-compose.yml
          gcloud storage cp docker-compose.prod.yml gs://${{ vars.DEPLOY_BUCKET }}/docker-compose.prod.yml

      - name: Deploy to GCE backbone (compose pull & up)
        run: |
          gcloud compute ssh ${{ vars.GCE_INSTANCE }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --zone=${{ vars.GCE_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --command="
              set -e
              # GCS から最新の compose を VM へ再取得（VM SA = roles/storage.objectViewer）。
              # これをしないと起動時に取得した古い compose のまま up され、変数参照のずれ等が起きる。
              TOKEN=\$(curl -sf -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' | sed -n 's/.*\"access_token\":\"\([^\"]*\)\".*/\1/p')
              sudo curl -fsS -H \"Authorization: Bearer \$TOKEN\" -o /opt/app/docker-compose.base.yml 'https://storage.googleapis.com/storage/v1/b/${{ vars.DEPLOY_BUCKET }}/o/docker-compose.yml?alt=media'
              sudo curl -fsS -H \"Authorization: Bearer \$TOKEN\" -o /opt/app/docker-compose.prod.yml 'https://storage.googleapis.com/storage/v1/b/${{ vars.DEPLOY_BUCKET }}/o/docker-compose.prod.yml?alt=media'
              sudo docker compose \
                --env-file /opt/app/.env \
                -f /opt/app/docker-compose.base.yml \
                -f /opt/app/docker-compose.prod.yml \
                pull ec-backend backoffice-backend
              sudo docker compose \
                --env-file /opt/app/.env \
                -f /opt/app/docker-compose.base.yml \
                -f /opt/app/docker-compose.prod.yml \
                up -d ec-backend backoffice-backend
            "

      - name: Update Cloud Run edge (backoffice-backend)
        run: |
          gcloud run services update backoffice-edge \
            --image ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_ID }}/backoffice-backend:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }}

  # ── Job 6: Trivy 脆弱性スキャン → /ingest/security-scan ────────────────────
  # シナリオ5（DevOpsループ: 検知→調査→PR起票）の起点。
  # Trivy は1スキャンで HIGH/CRITICAL を大量に吐くので、jq で
  #   (1) HIGH/CRITICAL のみ抽出 (2) 最深刻=代表CVEに昇格 (3) 全件を vulnerabilities[] に同梱
  # まで整形してから1回 POST する（代表でインシデントを立て、AI は全件を一括リメディ）。
  # スキャン自体ではビルドを落とさない（--exit-code 0）。検知はパイプラインを止めず ingest に流す。
  security-scan:
    name: Trivy scan -> ingest
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Trivy fs scan (vuln, HIGH/CRITICAL) -> JSON
        # 依存（pnpm-lock 等）を対象にした fs スキャン。PR リメディ（パッケージ昇格）に直結する。
        # イメージ脆弱性を見たい場合は `fs .` を `image <ref>` に差し替える。
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:latest \
            fs --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 0 --no-progress \
            --format json --output /repo/trivy-report.json .

      - name: Transform & POST to /ingest/security-scan
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -z "$INGEST_URL" ]; then
            echo "INGEST_URL 未設定（Cloud Run 未デプロイ）。scan-only でスキップします。"
            exit 0
          fi

          # HIGH/CRITICAL を抽出し CRITICAL 優先で代表CVEに昇格、全件を vulnerabilities[] に同梱。
          payload=$(jq -c '
            [ .Results[]?.Vulnerabilities[]?
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")
              | { cveId: .VulnerabilityID, severity: .Severity,
                  package: .PkgName, version: .InstalledVersion,
                  fixedVersion: (.FixedVersion // null) } ] as $vulns
            | if ($vulns | length) == 0 then empty
              else
                ( ($vulns | map(select(.severity == "CRITICAL")) | .[0])
                  // ($vulns | .[0]) ) as $top
                | { cveId: $top.cveId, severity: $top.severity,
                    package: $top.package, version: $top.version,
                    fixedVersion: $top.fixedVersion,
                    scanner: "trivy", target: "repo:fs",
                    repo: "${{ github.repository }}",
                    vulnerabilities: $vulns }
              end
          ' trivy-report.json)

          if [ -z "$payload" ]; then
            echo "HIGH/CRITICAL なし。ingest スキップ。"
            exit 0
          fi

          echo "$payload" | jq '{ cveId, severity, count: (.vulnerabilities | length) }'
          curl -fsS -X POST "$INGEST_URL/ingest/security-scan" \
            -H "Content-Type: application/json" \
            -H "x-ingest-token: $INGEST_TOKEN" \
            -d "$payload"
