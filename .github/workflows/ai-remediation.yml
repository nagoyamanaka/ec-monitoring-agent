name: AI Remediation

# backend(dispatch経路)からの repository_dispatch で起動する、AI駆動の脆弱性修正ジョブ。
# 過去のローカル版（Trivyローカルスキャン + Copilot Agent プロンプト）の CI/CD 版:
#   ブランチ作成 → AIエージェントが実コード修正 → trivy 再スキャン + UT/E2E が緑になるまで → draft PR。
# 修正の精度は「テストゲートのある実行環境」で担保する（API サーバ内では実コードを書かない）。
on:
  repository_dispatch:
    types: [ai-remediation]
  # 手動実行。**本番の連鎖（backend → dispatch → callback）とは別物**で、ランナー側の配線
  # （WIF+Vertex 認証・gemini CLI のフラグ・docker 内 trivy・gh pr create）だけを、backend や
  # PAT 権限と切り離して検証するための口。D3-b の合格判定はあくまで repository_dispatch 側。
  workflow_dispatch:
    inputs:
      alertId:
        description: "対象 alertId（ブランチ名と callback のキーになる。手動検証なら任意の文字列でよい）"
        required: true
        type: string
      baseRef:
        description: "修正の土台にする ref（＝PR の base）"
        required: false
        default: demo/security-baseline
        type: string
      maxAttempts:
        description: "AI自己修正ループの上限"
        required: false
        default: "2"
        type: string
      cveIds:
        description: "対象を絞る CVE（カンマ区切り・空なら base で見つかった HIGH/CRITICAL 全件）。本番と同じ範囲で試すなら CVE-2021-3807,CVE-2022-25883"
        required: false
        default: ""
        type: string
      callback:
        description: "backend へ結果を POST するか（off にすると存在しない alertId の record を作らずに済む）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  id-token: write # WIF の OIDC トークン取得（Vertex AI 認証）に必須

jobs:
  remediate:
    runs-on: ubuntu-latest
    env:
      # repository_dispatch では client_payload、workflow_dispatch では inputs から取る。
      # 片方のイベントでは他方のコンテキストが空になるので `||` で畳める。
      ALERT_ID: ${{ github.event.client_payload.alertId || inputs.alertId }}
      # 脆弱性一覧（backend が dispatch 時に同梱）。AIエージェントの修正入力。
      # 手動実行では payload が無いので、下の step が checkout 先を trivy スキャンして同じ形を作る。
      VULNERABILITIES: ${{ toJSON(github.event.client_payload.vulnerabilities) }}
      BRANCH: security/ai-remediation-${{ github.event.client_payload.alertId || inputs.alertId }}
      # 修正の土台にする ref（＝PR の base）。repository_dispatch の既定は default branch だが、
      # 脆弱性の実体は baseline ブランチ側にあるので backend の設定値（GITHUB_REMEDIATION_BASE_REF）を
      # client_payload で運ぶ。空なら既定ブランチ＝従来どおり。
      BASE_REF: ${{ github.event.client_payload.baseRef || inputs.baseRef || github.event.repository.default_branch }}
      # AI自己修正ループの上限（backend config が単一ソース。未指定時のみ 2 にフォールバック）。
      # 通らないと延々リトライして課金暴走するのを防ぐ安全弁。
      MAX_ATTEMPTS: ${{ github.event.client_payload.maxAttempts || inputs.maxAttempts || '2' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.baseRef || inputs.baseRef || github.event.repository.default_branch }}

      # ローカル composite action は「チェックアウトされた作業ツリー」から解決される。上で base ref
      # （脆弱な baseline ブランチ）を被せた以上、そこに .github/actions がある保証は無い——結果 callback が
      # 「修正対象ブランチに何が commit されているか」に依存してしまう。既定ブランチ側の CI 部品だけを
      # 別パスへ取り出して、その依存を切る。
      - name: Checkout CI tooling (composite actions) from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .ci-tooling
          sparse-checkout: .github/actions

      # 取り出した部品は修正ブランチの中身ではない。無視させないと「変更あり」の誤検出と
      # `git add -A` での巻き込み commit を起こす。
      - name: Exclude CI tooling from the remediation worktree
        run: echo "/.ci-tooling/" >> .git/info/exclude

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -C（強制作成）にしてあるのは、同じ alertId で再実行しうるため（手動検証・本番のリトライとも）。
      # security/ai-remediation-* は bot 所有の名前空間なので、作り直しで失うものは無い。
      - name: Create remediation branch
        run: git switch -C "$BRANCH"

      # 修正前の base ref をスキャンして基準線を取る。用途は2つ:
      #   (1) 手動実行では client_payload が無いので、ここから AI へ渡す脆弱性リストを作る
      #   (2) どちらのトリガでも「もともと base にあった CVE」を記録し、AI が新たに持ち込んだ
      #       ものと区別できるようにする（下のゲートの参考情報）
      # 出力はワークツリー外に置く（スキャン結果が「AI の変更」として commit されたり
      # 変更検知を汚したりしないため）。
      - name: Scan the base ref (baseline for the gate)
        env:
          EVENT_NAME: ${{ github.event_name }}
          # 対象を絞る CVE。シェルへ直接展開せず env 経由で受ける（入力をコマンドに混ぜない）。
          CVE_IDS: ${{ inputs.cveIds }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP:/out" -w /repo aquasec/trivy:latest \
            fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            --format json --output /out/base-scan.json .
          jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | .[]' \
            "$RUNNER_TEMP/base-scan.json" > "$RUNNER_TEMP/base-cves.txt"
          echo "${BASE_REF} の既存 HIGH/CRITICAL: $(wc -l < "$RUNNER_TEMP/base-cves.txt") 種"

          [ "$EVENT_NAME" = "workflow_dispatch" ] || exit 0

          jq -c '[ .Results[]?.Vulnerabilities[]?
                   | { cveId: .VulnerabilityID, severity: .Severity,
                       package: .PkgName, version: .InstalledVersion,
                       fixedVersion: (.FixedVersion // null) } ] | unique_by(.cveId, .package)' \
            "$RUNNER_TEMP/base-scan.json" > "$RUNNER_TEMP/vulns.json"

          # 絞り込み。base 全件を対象にすると、AI が指示されていない推移依存（tar 等）まで
          # 直さないとゲートを越えられず、PR 起票まで到達しない＝ランナー配線の検証にならない。
          if [ -n "${CVE_IDS:-}" ]; then
            jq -c --arg ids "$CVE_IDS" \
              '($ids | split(",") | map(gsub("^\\s+|\\s+$";"") | ascii_upcase)) as $keep
               | map(select((.cveId | ascii_upcase) as $c | $keep | index($c)))' \
              "$RUNNER_TEMP/vulns.json" > "$RUNNER_TEMP/vulns.filtered.json"
            mv "$RUNNER_TEMP/vulns.filtered.json" "$RUNNER_TEMP/vulns.json"
          fi

          echo "手動実行の修正対象: $(jq 'length' "$RUNNER_TEMP/vulns.json") 件"
          jq -r '.[] | "  \(.cveId)  \(.package)@\(.version) -> \(.fixedVersion // "(fixなし)")"' \
            "$RUNNER_TEMP/vulns.json"

      # Vertex AI へのキーレス認証（app.yml / terraform.yml と同じ WIF 経路）。
      # API キー（GEMINI_API_KEY）を廃止したので、secret が1本減り、認証・モデル・課金先が
      # backend（Vertex）と揃う。SA は修正ジョブ専用＝roles/aiplatform.user のみで、
      # デプロイ用 SA は使い回さない（修正ジョブにデプロイ権限は要らない）。
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.REMEDIATION_SA }}

      # Gemini CLI（非対話）をバイナリで導入。バイナリ実行にするのは、下の
      # 「修正→検証→失敗をフィードバックして再修正」ループを上限つきで回すため
      # （Action 1発だと我々のテストゲートでの自己修正ループを制御できない）。
      # ※ パッケージ名/CLI フラグは利用時点の最新リリースに合わせてピン留め・要確認。
      # ★品質不足ならこのループの gemini 呼び出しを claude(code) CLI に差し替えるだけ（ゲートは不変）。
      #   差し替えは step 1個の置換で足りるので composite action にはしない（契約はテストゲートが担う）。
      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      # ── AI修正 → テストゲート検証 → 失敗なら再修正、を MAX_ATTEMPTS まで ──────
      # ここが精度と課金の両立点: 検証（対象CVEの再スキャン+typecheck+test）が緑になるまで
      # 自己修正するが、上限回数で必ず打ち切る（無限リトライ＝課金暴走を防ぐ安全弁）。
      - name: AI self-correction loop (bounded by MAX_ATTEMPTS)
        id: fix
        env:
          # ADC（auth step が出力）で Vertex AI を叩く。API キーは使わない。
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
        run: |
          set -u
          # 入力の出どころ: 本番は client_payload（job env）、手動実行は上の step が作ったファイル。
          # GITHUB_ENV で job env を上書きする形は precedence が紛らわしいので、明示的に選ぶ。
          if [ -s "$RUNNER_TEMP/vulns.json" ]; then
            vulns=$(cat "$RUNNER_TEMP/vulns.json")
          else
            vulns="$VULNERABILITIES"
          fi

          # 依頼が空なら検証すべきものが無い。黙って緑にすると「直した」の証拠にならないので落とす
          # （backend は vulnerabilities が空なら dispatch せず skipped にするので、ここに来る＝配線の異常）。
          want_count=$(jq 'length' <<<"$vulns" 2>/dev/null || echo 0)
          if [ "$want_count" -eq 0 ]; then
            echo "::error::修正対象の脆弱性が0件で起動されました。検証すべきものがありません。"
            exit 1
          fi
          echo "修正対象: ${want_count} 件"

          # テストゲート。**「リポジトリ全体で HIGH/CRITICAL ゼロ」は条件にしない。**
          # base に元から多数の推移依存 CVE があり（実測: main で25種）、AI はそれを直すよう
          # 指示されてもいない（プロンプトは vulns に限定）。全件ゼロを要求すると verified が
          # 永久に立たず、draft PR が原理的に出なくなる＝依頼と検証の粒度を揃える。
          verify_gate() {
            pnpm install --no-frozen-lockfile || return 1
            docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP:/out" -w /repo aquasec/trivy:latest \
              fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
              --format json --output /out/rescan.json . || return 1

            remaining=$(jq -r --argjson want "$vulns" \
              '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] as $found
               | [$want[]?.cveId] | unique | map(select(. as $c | $found | index($c))) | join(", ")' \
              "$RUNNER_TEMP/rescan.json")
            if [ -n "$remaining" ]; then
              echo "未修正の対象CVE: ${remaining}"
              return 1
            fi

            # 参考情報（ゲートにはしない）: AI が新たに持ち込んだ CVE を可視化する。
            # ここを不合格条件にすると、無関係な推移依存の入れ替わりで止まりうるので出すだけにする。
            jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | .[]' \
              "$RUNNER_TEMP/rescan.json" > "$RUNNER_TEMP/after-cves.txt"
            comm -13 "$RUNNER_TEMP/base-cves.txt" "$RUNNER_TEMP/after-cves.txt" | paste -sd, - \
              > "$RUNNER_TEMP/introduced.txt"

            pnpm typecheck || return 1
            pnpm test || return 1
          }

          attempt=1
          verified=false
          feedback=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "::group::Remediation attempt ${attempt}/${MAX_ATTEMPTS}"
            prompt="あなたはセキュリティ脆弱性を修正するコーディングエージェントです。
            次の HIGH/CRITICAL 脆弱性をすべて修正してください（JSON配列）:
            ${vulns}

            手順:
            1. 影響パッケージを fixedVersion 以上へ更新（package.json/lockfile、必要なら Dockerfile。yarn.lock/pnpm-lock 両対応）。
            2. 破壊的変更があればソースを最小限修正。変更は必要十分に留める。
            3. pnpm install でロックファイルを整合させる。
            修正方針の要約を REMEDIATION_NOTE.md に出力すること（証跡）。
            ${feedback}"

            # ※ -y/--yolo（ツール自動承認）・-p/--prompt（非対話）はリリースに合わせ要確認。
            gemini -y -p "$prompt" || true

            # 検証（テストゲート）。出力を捕捉し、失敗時は次試行のフィードバックに使う。
            if verify_gate > verify.log 2>&1; then
              verified=true
              echo "::endgroup::"
              echo "attempt ${attempt} verified ✅"
              break
            fi

            feedback="前回（試行${attempt}）の修正は検証に失敗しました。対象CVEの再スキャン/typecheck/test のいずれかが赤です。
            以下の検証ログ末尾を踏まえ、最小修正で再度直してください:
            $(tail -c 4000 verify.log)"
            echo "::endgroup::"
            attempt=$((attempt + 1))
          done

          # 検証ログは成果物ではなく作業ファイル。commit 対象に混ざると「変更あり」を誤検出する。
          rm -f verify.log

          # ゲートには含めないが、AI が新たに持ち込んだ CVE は必ず表に出す（隠すと PR の意味が濁る）。
          if [ -s "$RUNNER_TEMP/introduced.txt" ]; then
            echo "::warning::base に無かった HIGH/CRITICAL が増えています: $(cat "$RUNNER_TEMP/introduced.txt")"
          fi

          # 「緑」と「直した」は別物。base が既に trivy 緑だと AI が何もしなくても verified=true に
          # なり、その先の git commit が変更ゼロで exit 1 して job ごと落ちる＝経路が回った証拠にすら
          # ならない終わり方をしていた。ここで明示的に分け、無変更は失敗ではなく skipped として返す。
          if [ -n "$(git status --porcelain)" ]; then
            changed=true
          else
            changed=false
          fi

          echo "verified=${verified}" >> "$GITHUB_OUTPUT"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "verified=${verified} changed=${changed}"
          if [ "$verified" != "true" ]; then
            echo "上限 ${MAX_ATTEMPTS} 回で検証通過せず。PRは起票せず failed として返します。"
          elif [ "$changed" != "true" ]; then
            echo "検証は緑だが変更ゼロ（${BASE_REF} に修正対象が残っていない）。PRは起票せず skipped として返します。"
          fi

      # ── 緑かつ変更ありなら draft PR 起票（自動マージなし=人間レビュー）──────────
      - name: Open draft PR
        id: pr
        if: ${{ steps.fix.outputs.verified == 'true' && steps.fix.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ai-remediation[bot]"
          git config user.email "ai-remediation@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): AI remediation for alert ${ALERT_ID}"
          # ブランチを -C で作り直しているので push も強制。bot 所有の名前空間に閉じている。
          git push -u --force origin "$BRANCH"
          # base は checkout した ref に揃える（既定ブランチへ向けると baseline 差分が丸ごと乗る）。
          # 同じ alertId の再実行では PR が既に開いている＝create が失敗するので、その場合は既存を引く。
          url=$(gh pr create --draft \
            --title "fix(security): AI remediation (alert ${ALERT_ID})" \
            --body "AI が起票したセキュリティ修正です。trivy 再スキャン + UT 緑を確認済み。マージ前にレビューしてください。" \
            --base "$BASE_REF" \
            --head "$BRANCH" 2>/dev/null) || url=$(gh pr view "$BRANCH" --json url -q .url)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # ── backend へ結果 callback（成功/失敗いずれも必ず通知）─────────────────
      # 3状態を書き分ける: drafted（PR起票）/ skipped（緑だが直すものが無かった）/ failed（上限まで赤）。
      - name: Build callback payload
        if: always()
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          VERIFIED: ${{ steps.fix.outputs.verified }}
          CHANGED: ${{ steps.fix.outputs.changed }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ -n "$PR_URL" ]; then
            jq -nc --arg id "$ALERT_ID" --arg url "$PR_URL" \
              '{alertId:$id, status:"drafted", pullRequestUrl:$url}' > ingest-remediation-result.json
            jq . ingest-remediation-result.json
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ] && [ "$VERIFIED" = "true" ] && [ "$CHANGED" = "false" ]; then
            jq -nc --arg id "$ALERT_ID" --arg ref "$BASE_REF" \
              '{alertId:$id, status:"skipped", reason:("テストゲート（対象CVEの再スキャン/typecheck/test）は緑で、\($ref) に修正すべき変更は残っていませんでした")}' \
              > ingest-remediation-result.json
            jq . ingest-remediation-result.json
            exit 0
          fi

          # 失敗の理由を「どこまで進んだか」で書き分ける。全部を「上限まで赤」と書くと、
          # PR 起票やジョブ前半で落ちた回も同じ文面になり、画面から原因が読めなくなる。
          if [ "$VERIFIED" = "false" ]; then
            reason="AI修正が上限${MAX_ATTEMPTS}回でテストゲート（対象CVEの再スキャン/typecheck/test）を通過しませんでした"
          elif [ "$VERIFIED" = "true" ]; then
            reason="テストゲートは通過しましたが、修正PRの起票に失敗しました（GitHub Actions の実行ログを確認してください）"
          else
            reason="修正ジョブが検証に到達する前に失敗しました（GitHub Actions の実行ログを確認してください）"
          fi
          jq -nc --arg id "$ALERT_ID" --arg reason "$reason" \
            '{alertId:$id, status:"failed", reason:$reason}' > ingest-remediation-result.json
          jq . ingest-remediation-result.json

      # この POST だけは on-missing-url: fail。確定を運ぶ callback なので、届かないまま緑に
      # したら record が dispatched のまま永久に残る（＝backend 側の期限切れ処理が拾うまで宙に浮く）。
      # 他2本（検知・予兆）は届かなくてもその1件が欠けるだけなので skip でよい、という区別。
      # 手動実行で callback=false のときだけ送らない（実在しない alertId の record を作らないため）。
      # repository_dispatch では常に送る＝確定を運ぶ義務がある。
      - name: Callback to backoffice (result)
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.callback) }}
        uses: ./.ci-tooling/.github/actions/ingest-post
        with:
          url: ${{ secrets.INGEST_URL }}
          token: ${{ secrets.INGEST_TOKEN }}
          path: /ingest/remediation-result
          payload-file: ingest-remediation-result.json
          on-missing-url: fail
