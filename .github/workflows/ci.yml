name: CI

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: 静的チェック（インフラ不要・高速）──────────────────────────────
  check:
    name: typecheck / UT
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # ── Job 2: E2E（Docker Compose でフルスタック起動）────────────────────────
  # check が通ってから実行。AI_INVESTIGATION_STUB=true が local compose に設定済み
  # なので Gemini API キーは不要。
  e2e:
    name: E2E (Docker Compose)
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Run E2E suite
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml \
            run --rm e2e
