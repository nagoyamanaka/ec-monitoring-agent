services:

  mongo:
    ports:
      - "27017:27017"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  ec-backend:
    build:
      context: .
      dockerfile: src/apps/ec/backend/Dockerfile
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      PAYMENT_MODE: success
      DEMO_CONTROLS_ENABLED: "true"
      FEEDBACK_AUTO_PROMOTE_THRESHOLD: "3"
      GCP_PROJECT_ID: local
