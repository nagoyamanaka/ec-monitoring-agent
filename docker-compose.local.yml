services:

  mongo:
    ports:
      - "27017:27017"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  ec-backend:
    build:
      context: .
      dockerfile: src/apps/ec/backend/Dockerfile
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      PAYMENT_MODE: success
      DEMO_CONTROLS_ENABLED: "true"
      FEEDBACK_AUTO_PROMOTE_THRESHOLD: "3"
      GCP_PROJECT_ID: local

  backoffice-backend:
    build:
      context: .
      dockerfile: src/apps/backoffice/backend/Dockerfile
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DEMO_ENABLED: "true"
      # ローカルE2E: AI調査の LLM を Stub に差し替え（Gemini課金・非決定性なし）
      AI_INVESTIGATION_STUB: "true"
      # demo シナリオ facade が EC backend を叩く接続先
      EC_BACKEND_URL: http://ec-backend:3000
      # payment-timeout シナリオで在庫予約を通すため有効な UUID 商品を使う（global-setup が seed）
      DEMO_PRODUCT_ID: "11111111-1111-4111-8111-111111111111"
      GCP_PROJECT_ID: local
    depends_on:
      ec-backend:
        condition: service_healthy

  backoffice-frontend:
    build:
      context: .
      dockerfile: src/apps/backoffice/frontend/Dockerfile
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # vite dev server のプロキシ転送先（/alerts, /analytics などをバックエンドへ）
      BACKOFFICE_API: http://backoffice-backend:3001
    depends_on:
      backoffice-backend:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    environment:
      SWAGGER_JSON_URL: http://localhost:3000/openapi.json
    profiles:
      - swagger

  e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    depends_on:
      ec-backend:
        condition: service_healthy
      backoffice-backend:
        condition: service_healthy
    environment:
      EC_BASE_URL: http://ec-backend:3000
      MONGO_URL: mongodb://mongo:27017/ec
      # backoffice E2E 用（別プロセス・別DB）
      BACKOFFICE_BASE_URL: http://backoffice-backend:3001
      MONITORING_MONGO_URL: mongodb://mongo:27017/monitoring
