services:

  mongo:
    ports:
      - "27017:27017"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  ec-backend:
    build:
      context: .
      dockerfile: src/apps/ec/backend/Dockerfile
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      PAYMENT_MODE: success
      DEMO_CONTROLS_ENABLED: "true"
      FEEDBACK_AUTO_PROMOTE_THRESHOLD: "3"
      GCP_PROJECT_ID: local

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    environment:
      SWAGGER_JSON_URL: http://localhost:3000/openapi.json
    profiles:
      - swagger

  e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    depends_on:
      ec-backend:
        condition: service_healthy
    environment:
      EC_BASE_URL: http://ec-backend:3000
      MONGO_URL: mongodb://mongo:27017/ec
