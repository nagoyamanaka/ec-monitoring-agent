services:
  # ── GCE backbone のステートフル層 ─────────────────────────
  # Cloud Run edge から VPC connector 越しに到達できるよう内部ポートを公開する。
  # 公開先 IP は VM 内部 IP、到達範囲は firewall（subnet / connector CIDR）で絞る（step4-1-strategy §11.1）。
  mongo:
    ports:
      - "27017:27017"

  rabbitmq:
    ports:
      - "5672:5672"

  elasticsearch:
    ports:
      - "9200:9200"

  valkey:
    # backbone VM のメモリ最適化に追随して Valkey の使用上限を 4GB→2GB に縮小する。
    # 上限到達時は LRU で eviction（SoT ではない派生ビュー/transport なので破棄可）。
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "2gb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "6379:6379"

  # ── EC backend ───────────────────────────────────────────
  ec-backend:
    image: ${IMAGE_EC}
    ports:
      - "3000:3000"
    environment:
      PAYMENT_MODE: ${PAYMENT_MODE:-success}
      DEMO_CONTROLS_ENABLED: ${DEMO_CONTROLS_ENABLED:-true}
      FEEDBACK_AUTO_PROMOTE_THRESHOLD: ${FEEDBACK_AUTO_PROMOTE_THRESHOLD:-3}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    restart: unless-stopped

  # ── Monitoring worker（EDA subscriber + AI調査）─────────────
  # backbone 側の常駐 worker。RabbitMQ 常駐 Subscriber を抱えるため Cloud Run でなく GCE に置く。
  # クエリ/SSE の配信エッジは Cloud Run（cloud-run module）で別途。worker/edge のコード分離は後続作業。
  backoffice-backend:
    image: ${IMAGE_BACKOFFICE}
    ports:
      - "3001:3001"
    environment:
      # 常駐 worker 役：RabbitMQ consumer ＋ AI 調査 ＋ Valkey へ publish（fan-out 購読は edge=Cloud Run）。
      # これにより Cloud Run edge を ROLE=edge / min-instances=0 にできる（task17/19・§11.3）。
      ROLE: ${ROLE:-worker}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      # Gemini は Vertex AI 経由（ADC＝GCE VM のアタッチ SA・roles/aiplatform.user）。
      # 無料クレジットが適用され、API キーは不要。
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-true}
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
      # モデル到達リージョン。.env.local と揃えて asia-northeast1 に固定（config.ts の既定は global）。
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-asia-northeast1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
      # AI調査をADKマルチエージェント（7エージェント自律調査）に切替。未設定だと単一Gemini版に
      # フォールバックしていた（＝本番でADKが使われていなかった原因はこのフラグ欠落）。Vertex 必須。
      AI_INVESTIGATION_ADK: ${AI_INVESTIGATION_ADK:-true}
      # ADK 自律ループの LLM 呼び出し上限（トークン暴走の安全弁）。config.ts 既定と同値だが明示。
      AI_INVESTIGATION_ADK_MAX_LLM_CALLS: ${AI_INVESTIGATION_ADK_MAX_LLM_CALLS:-16}
      # コーディネーターの思考トークン予算（fallback 第6原因＝思考が出力予算を食い潰し空応答=confidence0 の防御）。
      # gemini-2.5-pro は思考も maxOutputTokens を消費するため上限にキャップして最終JSON用トークンを残す。
      # 有効域 128〜32768・-1 で動的。増やすほど推論は深いが wall-clock が伸びて D3 タイムアウト risk 増。
      AI_INVESTIGATION_COORDINATOR_THINKING_BUDGET: ${AI_INVESTIGATION_COORDINATOR_THINKING_BUDGET:-16384}
      # 単一Gemini経路(GeminiLLMClient)の1呼び出しタイムアウト(ms)。旧ハードコード30秒だと
      # gemini-2.5-pro が超過して毎回 fallback(confidence=0) に落ちていたため 90秒へ。
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-90000}
      # AI 調査のウォールクロック上限(ms)。config.ts の既定と同値だが、運用チューニング点として明示。
      # ADK 7エージェント自律ループは実測 92-116秒で既定120秒だと並列時に暫定落ちするため 240秒。
      AI_INVESTIGATION_TIMEOUT_MS: ${AI_INVESTIGATION_TIMEOUT_MS:-240000}
      # RabbitMQ channel prefetch。1 だと長時間の AI 調査ハンドラが全キューを止める（HOLブロッキング）。
      # config.ts の既定と同値だが、運用チューニング点として明示。
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-3}
      # 検知 ingest（Cloud Monitoring webhook）認証トークン（§11.2）
      INGEST_TOKEN: ${INGEST_TOKEN}
      # AI 調査の証拠収集（GitHubGatewayImpl）＋証拠リンク生成（evidenceLinks）で使う。
      # 両方揃わないとコミット収集を丸ごとスキップし、コミットのディープリンクも出せない
      # （調査レポートに「実コミットへのリンク」が出なかった原因はこの2変数の欠落）。
      # GITHUB_TOKEN は read-only（repo:contents 読み取り）で足り、値だけは Secret Manager から供給する
      # （startup-script が .env に注入。以下 REPO/REF/REMEDIATION は非シークレットなので default で持つ）。
      GITHUB_TARGET_REPO: ${GITHUB_TARGET_REPO:-nagoyamanaka/ec-monitoring-agent}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # 調査が見る ref。demo/regression 固定で、審査員がいつ見ても壁時計非依存で証跡コミットを拾う
      # （未設定だと本番は既定ブランチ main を時間窓で絞り、デモ証跡が窓外に落ちる）。
      GITHUB_TARGET_REF: ${GITHUB_TARGET_REF:-demo/regression}
      # 修正PRの起票先／レビュー対象 PR の所在（シナリオ5/7）。
      GITHUB_REMEDIATION_REPO: ${GITHUB_REMEDIATION_REPO:-nagoyamanaka/ec-monitoring-agent}
      # 修正PRの base ブランチ（脆弱な状態を用意した baseline へ向ける・シナリオ5）。
      GITHUB_REMEDIATION_BASE_REF: ${GITHUB_REMEDIATION_BASE_REF:-demo/security-baseline}
      # リメディ実行戦略。advisory=in-processで方針PRを実起票（.env.local と同値）。
      # ※ config.ts の既定は "demo"（GitHub 非接触の固定URL）。ここを advisory にすると実PRを起票する。
      REMEDIATION_MODE: ${REMEDIATION_MODE:-demo}
      # SimilarPatternRule（graded confidence 分類）用
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # read-model projection ＋ SSE Pub/Sub（base の REDIS_URL=redis://valkey:6379 を継承）
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
